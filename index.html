<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INMU KING – YAJU-MC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/controls.css">
<style>
:root{--bg:#f4f1ec;--fg:#16120d;--mut:#6b6358;--acc:#d6232a;--card:#fff;--line:#ddd6ca}
@media (prefers-color-scheme:dark){:root{--bg:#0b0a09;--fg:#f3eee6;--mut:#9a9184;--acc:#ff3b3b;--card:#16130f;--line:#2b2620}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
.logo{font-weight:900;letter-spacing:.15em;font-size:13px;color:var(--mut);margin-bottom:18px}
.logo b{color:var(--acc)}
h1{font-size:clamp(40px,12vw,88px);line-height:.95;margin:0 0 6px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
h1 span{color:var(--acc)}
.artist{color:var(--mut);margin:0 0 20px;font-size:15px;letter-spacing:.08em}
#c{width:100%;aspect-ratio:16/9;max-height:none;background:#000;border-radius:14px;overflow:hidden}
#c video{width:100%;height:100%}
.info{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.info dt{font-size:11px;letter-spacing:.12em;color:var(--mut);margin-bottom:3px}
.info dd{margin:0;font-weight:700}
footer{margin-top:28px;color:var(--mut);font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">YAJU-MC <b>●</b> OFFICIAL MV VIEWER</div>
<h1>INMU <span>KING</span></h1>
<p class="artist">YAJU-MC</p>

<div id="c" data-shaka-player-container>
  <video data-shaka-player id="v" playsinline src="https://files.catbox.moe/sbpso8.mp4"></video>
</div>

<dl class="info">
  <div><dt>TITLE</dt><dd>INMU KING</dd></div>
  <div><dt>ARTIST</dt><dd>YAJU-MC</dd></div>
  <div><dt>FORMAT</dt><dd>Music Video / MP4</dd></div>
</dl>
<footer>© YAJU-MC / INMU KING</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.ui.js"></script>
</body>
</html>
